{% extends "base.html" %}

{% block content %}

<div class="container text-center mt-5">

    <h1 class="mb-3">Welcome to Portfolio Dashboard</h1>

    <p class="text-muted mb-4">
        Please log in to continue. New registrations are temporarily unavailable.
    </p>

    <div class="d-flex justify-content-center gap-3">
        <button type="button" class="btn btn-primary" disabled
                aria-disabled="true" title="Registration is temporarily unavailable">
            Register
        </button>

        <a href="/login" class="btn btn-outline-primary">
            Login
        </a>
    </div>

    <p class="text-muted small mt-4">
        Powered by Bayantech Ltd
    </p>

</div>

{% endblock %}
